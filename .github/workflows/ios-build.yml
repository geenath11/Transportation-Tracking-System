
name: iOS CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build and Test iOS
    runs-on: macos-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Check Flutter setup
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase options
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          test -n "$FIREBASE_OPTIONS_DART" || {
            echo "FIREBASE_OPTIONS_DART secret is missing."
            exit 1
          }
          printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Restore Firebase iOS configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          test -n "$GOOGLE_SERVICE_INFO_PLIST" || {
            echo "GOOGLE_SERVICE_INFO_PLIST secret is missing."
            exit 1
          }
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Format Firebase options
        run: dart format lib/firebase_options.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            artifacts/Runner-unsigned.app.zip

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceygo-ios-unsigned-${{ github.sha }}
          path: apps/mobile_app/artifacts/Runner-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14
