name: Admin Panel - CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci-cd.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'admin/**'
  workflow_dispatch:

jobs:
  build-admin:
    name: Build & Test Admin Panel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./admin
   
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Build admin panel
        run: npm run build --if-present
    
     deploy-admin:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    needs: build-admin
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: "admin/"
          TARGET: ${{ secrets.ADMIN_APP_DIR }}
          ARGS: "-avzr --delete --exclude=node_modules --exclude=.git"
   
      - name: Restart Admin Panel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.ADMIN_APP_DIR }}
            npm install --production
            pm2 restart admin-panel || pm2 start npm --name "admin-panel" -- start
            pm2 save
