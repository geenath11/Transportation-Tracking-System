workflows:
  ios-build:
    name: CeyGo iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    working_directory: apps/mobile_app

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa