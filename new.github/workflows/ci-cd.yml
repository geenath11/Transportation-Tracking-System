name: Transportation Tracking System - CI/CD

on:
	push:
		branches: [ "main", "ci-cd" , "develop" ]
	pull_request:
		branches: [ "main", "ci-cd" , "develop"]

jobs :  # CI- checks
  test :
    name : Run Tests
    Runs-on : ubuntu-latest

    steps :
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  deploy: # CD- deployment
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: ${{ secrets.APP_DIR }}
          SOURCE: "./"
          ARGS: "-avzr --delete --exclude=node_modules --exclude=.git "

      - name: Restart Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            npm install --production
            pm2 restart transportation-app || pm2 start npm --name "transportation-app" -- start
            pm2 save 


